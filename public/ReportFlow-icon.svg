<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBgLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F590A0" />
      <stop offset="100%" stop-color="#F7A8B6" />
    </linearGradient>

    <linearGradient id="iconBgRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4E2" />
      <stop offset="100%" stop-color="#F9D2D0" />
    </linearGradient>

    <linearGradient id="iconFlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E66078" />
      <stop offset="100%" stop-color="#F2798F" />
    </linearGradient>

    <filter id="iconPinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D94B68" flood-opacity="0.55" />
    </filter>

    <clipPath id="iconClip">
      <rect width="512" height="512" rx="110" />
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <!-- Fond gauche -->
    <rect width="512" height="512" fill="url(#iconBgLeft)" />

    <!-- Fond droit en diagonale -->
    <polygon points="310,0 512,0 512,512 200,512" fill="url(#iconBgRight)" />

    <!-- Grille subtile en haut à gauche -->
    <g stroke="#FFD6DE" stroke-width="2" opacity="0.55">
      <line x1="0" y1="65" x2="240" y2="65" />
      <line x1="0" y1="135" x2="150" y2="135" />
      <line x1="75" y1="0" x2="75" y2="180" />
      <line x1="155" y1="0" x2="155" y2="110" />
    </g>

    <!-- Deux points décoratifs en haut à droite -->
    <circle cx="465" cy="55" r="7" fill="#E66078" opacity="0.85" />
    <circle cx="465" cy="82" r="7" fill="#E66078" opacity="0.85" />

    <!-- Coin bleu marine en bas à droite -->
    <polygon points="512,290 375,512 512,512" fill="#EA7B8B" opacity="0.85" />
    <polygon points="512,320 395,512 512,512" fill="#1F2963" />
    <line x1="512" y1="400" x2="442" y2="512" stroke="#A5B4FC" stroke-width="4" opacity="0.8" />

    <!-- Monogramme "R" (Blanc) -->
    <text x="58" y="365" font-family="&#39;Inter&#39;, &#39;Montserrat&#39;, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="290" letter-spacing="-8" fill="#FFFFFF" filter="url(#iconPinkGlow)">R</text>

    <!-- Monogramme "F" (Rose corail) -->
    <text x="262" y="365" font-family="&#39;Inter&#39;, &#39;Montserrat&#39;, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="290" letter-spacing="-8" fill="url(#iconFlowGrad)">F</text>
  </g>
</svg>